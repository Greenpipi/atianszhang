<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>财务管家</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="js/vendor/supabase.js"></script>
<script>window.supabase || document.write('<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0"><\/script>');</script>
</head>
<body>

<div id="offline-banner" class="offline-banner" hidden>
  <span>网络已断开，当前处于离线状态，恢复连接后将自动同步</span>
</div>

<!-- ============ 登录页 ============ -->
<div id="login-view" class="login-wrap">
  <div class="login-plant tr" aria-hidden="true">
    <svg width="190" height="165" viewBox="0 0 230 200" fill="none">
      <path d="M222 198C214 152 200 114 172 86" stroke="#A7F3D0" stroke-width="3" stroke-linecap="round"/>
      <path d="M216 152c-18-6-30-22-30-40 18 4 30 20 30 40z" fill="#D1FAE5"/>
      <path d="M200 120c16-10 22-28 18-46-16 8-22 26-18 46z" fill="#A7F3D0"/>
      <path d="M186 98c-16-4-28-18-30-36 17 3 29 17 30 36z" fill="#D1FAE5"/>
      <path d="M176 80c15-8 23-24 21-42-15 7-23 23-21 42z" fill="#ECFDF5"/>
      <path d="M170 64c-13-3-23-15-25-31 14 2 24 14 25 31z" fill="#D1FAE5"/>
      <circle cx="152" cy="132" r="5" fill="#A7F3D0"/>
      <circle cx="142" cy="148" r="4" fill="#D1FAE5"/>
    </svg>
  </div>
  <div class="login-plant bl" aria-hidden="true">
    <svg width="170" height="148" viewBox="0 0 230 200" fill="none">
      <path d="M222 198C214 152 200 114 172 86" stroke="#A7F3D0" stroke-width="3" stroke-linecap="round"/>
      <path d="M216 152c-18-6-30-22-30-40 18 4 30 20 30 40z" fill="#D1FAE5"/>
      <path d="M200 120c16-10 22-28 18-46-16 8-22 26-18 46z" fill="#A7F3D0"/>
      <path d="M186 98c-16-4-28-18-30-36 17 3 29 17 30 36z" fill="#D1FAE5"/>
      <path d="M176 80c15-8 23-24 21-42-15 7-23 23-21 42z" fill="#ECFDF5"/>
      <path d="M170 64c-13-3-23-15-25-31 14 2 24 14 25 31z" fill="#D1FAE5"/>
      <circle cx="152" cy="132" r="5" fill="#A7F3D0"/>
      <circle cx="142" cy="148" r="4" fill="#D1FAE5"/>
    </svg>
  </div>
  <div class="login-card">
    <div class="login-logo">
      <img src="logo.png" alt="财务管家" width="64" height="64">
    </div>
    <h1 class="login-title">财务管家</h1>
    <p class="login-sub" id="login-mode-tip">正在连接云端…</p>
    <form id="login-form" autocomplete="off">
      <div class="field">
        <label for="login-email">邮箱</label>
        <input type="email" id="login-email" placeholder="you@example.com" required>
      </div>
      <div class="field">
        <label for="login-password">密码</label>
        <input type="password" id="login-password" placeholder="至少 6 位" minlength="6" required>
      </div>
      <div class="login-error" id="login-error" hidden></div>
      <button type="submit" class="btn btn-primary btn-block" id="login-btn">登 录</button>
      <button type="button" class="btn btn-ghost btn-block" id="toggle-signup">没有账号？注册一个</button>
    </form>
    <p class="login-foot">数据通过 Supabase 云端同步，多设备一致 · 行级安全隔离</p>
  </div>
</div>

<!-- ============ 主应用 ============ -->
<div id="app-view" class="app-shell" hidden>

  <div class="shell-body">
  <aside id="sidebar" class="sidebar">
    <div class="sidebar-brand">
      <img src="logo.png" alt="" width="30" height="30">
      <span>财务管家</span>
      <button type="button" class="nav-collapse-btn" id="nav-collapse" title="收起导航栏" aria-label="收起导航栏">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="15" rx="2.5"/><path d="M9.8 4.5v15"/></svg>
      </button>
    </div>
    <nav class="sidebar-nav" id="sidebar-nav">
      <a href="#/ledger" data-route="ledger" class="nav-item" title="记账本">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5a2 2 0 0 1 2-2h13a1 1 0 0 1 1 1v18l-4-2.6L12.4 22 8.8 19.4 5.6 22V5z"/><path d="M8 7h8M8 11h5"/></svg>
        <span>记账本</span>
      </a>
      <a href="#/wishlist" data-route="wishlist" class="nav-item" title="好物仓库">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 8.6a5.5 5.5 0 0 0-9.3-2.4l-.5.6-.5-.6a5.5 5.5 0 0 0-9.3 6.3l8.4 8.9a1.8 1.8 0 0 0 2.7 0l8.5-9.1a5.5 5.5 0 0 0 0-3.7z"/></svg>
        <span>好物仓库</span>
      </a>
      <a href="#/stats" data-route="stats" class="nav-item" title="统计">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
        <span>统计</span>
      </a>
      <a href="#/rental" data-route="rental" class="nav-item" title="出租屋">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.8V21h14V9.8"/><path d="M9.5 21v-6h5v6"/></svg>
        <span>出租屋</span>
      </a>
      <a href="#/budget" data-route="budget" class="nav-item" title="预算设置">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.2 2"/></svg>
        <span>预算设置</span>
      </a>
      <a href="#/settings" data-route="settings" class="nav-item" title="设置">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.56V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1.11-1.56 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.56-1.03H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.65 8.9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1.03-1.56V3a2 2 0 1 1 4 0v.09c0 .68.4 1.3 1.03 1.56.62.26 1.34.13 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9c.26.62.88 1.03 1.56 1.03H21a2 2 0 1 1 0 4h-.09c-.68 0-1.3.4-1.51 1.03z"/></svg>
        <span>设置</span>
      </a>
    </nav>
    <div class="sidebar-foot" id="sidebar-foot"></div>
  </aside>
  <div class="sidebar-mask" id="sidebar-mask"></div>

  <div class="plant-corner" aria-hidden="true">
    <svg width="230" height="200" viewBox="0 0 230 200" fill="none">
      <path d="M222 198C214 152 200 114 172 86" stroke="#A7F3D0" stroke-width="3" stroke-linecap="round"/>
      <path d="M216 152c-18-6-30-22-30-40 18 4 30 20 30 40z" fill="#D1FAE5"/>
      <path d="M200 120c16-10 22-28 18-46-16 8-22 26-18 46z" fill="#A7F3D0"/>
      <path d="M186 98c-16-4-28-18-30-36 17 3 29 17 30 36z" fill="#D1FAE5"/>
      <path d="M176 80c15-8 23-24 21-42-15 7-23 23-21 42z" fill="#ECFDF5"/>
      <path d="M170 64c-13-3-23-15-25-31 14 2 24 14 25 31z" fill="#D1FAE5"/>
      <circle cx="152" cy="132" r="5" fill="#A7F3D0"/>
      <circle cx="142" cy="148" r="4" fill="#D1FAE5"/>
    </svg>
  </div>

  <div class="main">
    <header class="topbar">
      <button class="icon-btn" id="menu-btn" aria-label="菜单">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <div class="topbar-page" id="page-title">记账本</div>
      <div class="topbar-right">
        <div class="ledger-switch" id="ledger-switch"></div>
        <div class="sync-chip" id="sync-chip" title="同步状态"></div>
        <div class="user-chip" id="user-chip"></div>
      </div>
    </header>

    <!-- 背景头图：默认柳枝浆果纹样插画，紧贴标题栏底线；可上传本地图片并拖动调整位置 -->
    <div class="page-hero" id="page-hero">
      <div class="hero-tools">
        <button type="button" class="hero-btn" id="hero-change">更换背景</button>
        <button type="button" class="hero-btn" id="hero-reset" hidden>恢复默认</button>
        <button type="button" class="hero-btn hero-btn-main" id="hero-adjust">调整位置</button>
      </div>
      <div class="hero-hint" id="hero-hint" hidden>拖动图片调整位置，调到满意后点「保存位置」</div>
      <input type="file" id="hero-file" accept="image/*" hidden>
    </div>

    <main class="content" id="content">
      <section class="view" id="view-ledger"></section>
      <section class="view" id="view-wishlist"></section>
      <section class="view" id="view-stats"></section>
      <section class="view" id="view-rental"></section>
      <section class="view" id="view-budget"></section>
      <section class="view" id="view-settings"></section>
    </main>
  </div>
  </div>
</div>

<div id="modal-root"></div>
<div id="toast-root"></div>

<script src="js/data.js"></script>
<script src="js/store.js"></script>
<script src="js/charts.js"></script>
<script src="js/app.js"></script>
</body>
</html>
